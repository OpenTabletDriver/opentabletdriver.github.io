<script type="text/javascript">
  document.onreadystatechange = function () {
    if (document.readyState == "complete") {
      let queryParams = new URLSearchParams(window.location.search);
      if (queryParams.has("search")) {
        let input = document.getElementById('searchInput');
        input.value = queryParams.get("search");
      }
      filter();
    }
  };

  function filterInput() {
    let input = document.getElementById('searchInput');
    let text = input.value;
    let action = 'Plugins'
    if (text.length > 0) {
        action += '?search=' + encodeURIComponent(text);
    }
    window.history.replaceState('', '', action);

    filter();
  }

  function filter() {
    let selector = document.getElementById('pluginVersionSelector');
    let targetVersion = selector.value;

    let searchInput = document.getElementById('searchInput');
    let searchFilter = searchInput.value.toUpperCase();

    let container = document.getElementById('metadataList');
    let cards = container.getElementsByClassName('plugin-metadata-card');

    let versions = {};

    if (targetVersion != '') {
      for (let i = 0; i < cards.length; i++) {
        let card = cards[i];
        let name = card.getAttribute('data-name').toUpperCase();
        let version = card.getAttribute('data-version');
        let maxVersion = card.getAttribute('data-max-version');

        if (!isCompatible(version, targetVersion))
          continue;

        if (name in versions) {
          if (versions[name] < version) {
            versions[name] = version;
          }
        } else {
          versions[name] = version;
        }
      }
    }

    for (let i = 0; i < cards.length; i++) {
      let card = cards[i];
      let name = card.getAttribute('data-name').toUpperCase();
      let version = card.getAttribute('data-version');
      let maxVersion = card.getAttribute('data-max-version');

      let searchMatches = name.indexOf(searchFilter) >= 0;
      let versionMatches = targetVersion == '' || isCompatible(version, targetVersion, maxVersion);
      let isNewest = true;
      if (name in versions) {
        isNewest = versions[name] == version;
      }

      card.style.display = searchMatches && versionMatches && isNewest ? '' : 'none';
    }
  }

  function isCompatible(pluginVersion, driverVersion, maxPluginVersion) {
    // support truth table:
    //  plugin  /  driver
    // 0.5.3.3 and 0.6.0.0: false
    // 0.6.0.0 and 0.5.3.3: false
    // 0.5.2.0 and 0.5.3.3: true
    // 0.5.3.3 and 0.5.2.0: false

    let pluginSplit = getIntSplit(pluginVersion);
    let maxPluginSplit = getIntSplit(maxPluginVersion);
    let driverSplit = getIntSplit(driverVersion);

    try {
      if (pluginSplit[0] != driverSplit[0] || (maxPluginSplit != null && maxPluginSplit[0] != driverSplit[0])) {
        return false;
      }

      if (pluginSplit[1] != driverSplit[1] || (maxPluginSplit != null && maxPluginSplit[1] != driverSplit[1])) {
        return false;
      }

      if (pluginSplit[2] > driverSplit[2] || (maxPluginSplit != null && maxPluginSplit[2] < driverSplit[2])) {
        return false;
      }

      // The final version number on a plugin's base version number is allowed through no matter what, this filtering is intentionally not applied:
      // pluginSplit[2] == driverSplit[2] && pluginSplit[3] > driverSplit[3]
      // Only the MaxSupportedPluginVersion is checked for the final version number
      if (maxPluginSplit != null && maxPluginSplit[2] == driverSplit[2] && maxPluginSplit[3] < driverSplit[3])
        return false;
    } catch (e) {
      console.error(`Failed to determine plugin version compatibility. Plugin version: ${pluginVersion}. Driver version: ${driverVersion}.\nError: ${e}`);
      return false;
    }

    return true;
  }

  function getIntSplit(inputString) {
    if (inputString)
      return inputString.split('.').map((x) => Number(x));

    return null;
  }
</script>
